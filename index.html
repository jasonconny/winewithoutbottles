<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page extend into the device's unsafe areas
      (notch, home indicator) so the artwork is genuinely full-bleed; the
      chrome then keeps clear via env(safe-area-inset-*) paddings (Show.scss).
      Without it, those env() values are always 0 on iOS.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Pre-hydration default; each route sets its own via usePageMeta. -->
    <meta name="theme-color" content="#000000" />

    <!-- The mark is a solid square of titleToRgb('Wine Without Bottles');
         see public/icon.svg for the derivation. Browsers that support SVG
         icons prefer it and fall back to the .ico. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Fonts are self-hosted via Fontsource (imported in src/index.tsx). -->

    <title>Wine Without Bottles</title>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
